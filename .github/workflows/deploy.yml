name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on EC2
        run: |
          set -e
          APP_DIR="/opt/fastapi-demo"
          if [ ! -d "$APP_DIR/.git" ] && [ -d "$HOME/devops/.git" ]; then
            APP_DIR="$HOME/devops"
          fi
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
