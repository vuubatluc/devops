<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastAPI Demo Console</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">EC2 + RDS + S3</p>
          <h1>FastAPI Demo Console</h1>
        </div>
        <div class="status-card" id="healthStatus">
          <span class="status-dot"></span>
          <span>Checking</span>
        </div>
      </header>

      <section class="panel create-panel">
        <div class="panel-header">
          <h2>Create Item</h2>
          <button type="button" id="refreshBtn">Refresh</button>
        </div>
        <form id="itemForm" class="form-grid">
          <label>
            Name
            <input name="name" type="text" placeholder="Demo item" required />
          </label>
          <label>
            Price
            <input name="price" type="number" min="0" step="0.01" placeholder="10.50" required />
          </label>
          <label class="wide">
            Description
            <textarea name="description" rows="3" placeholder="Short description"></textarea>
          </label>
          <div class="form-actions wide">
            <button type="submit">Create</button>
            <span id="formMessage" class="message"></span>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Items</h2>
          <a href="/docs" target="_blank" rel="noreferrer">Open API Docs</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>File</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="itemsBody">
              <tr>
                <td colspan="5" class="empty">Loading items</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
